name: CI

# Guard rail born from two production incidents: a package.json change
# without a lockfile update passes locally (node_modules already present)
# but kills every Vercel deploy with ERR_PNPM_OUTDATED_LOCKFILE — silently,
# since nothing was watching deploy status. Fail the PR instead.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Public CI-only values. Production uses deployment-managed secrets.
      DOODLENOTE_SELF_HOSTED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10.33.2

      # The incident guard. --ignore-scripts skips native postinstalls
      # (electron, llama.cpp, sherpa) that the checks below don't need —
      # lockfile validation happens at resolution time regardless.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Mac candidate verification boundaries
        run: |
          python3 -m unittest discover -s apps/desktop/scripts -p 'test_verify_existing_mac_candidate.py'
          node --test apps/desktop/scripts/mac-candidate-runtime-smoke.test.cjs
          ruby apps/desktop/scripts/test_mac_verification_workflow.rb
          ruby apps/desktop/scripts/test_mac_release_manifest.rb

      - name: Desktop typecheck
        run: pnpm --filter desktop typecheck

      - name: Desktop tests
        run: pnpm --filter desktop test

      - name: Local source index contracts
        run: |
          pnpm --filter @repo/meetings-store typecheck
          pnpm --filter @repo/meetings-store test

      - name: MCP server tests
        run: pnpm --filter doodle-note-mcp test

      - name: Notes engine tests
        run: pnpm --filter @repo/ai test

      - name: Database configuration tests
        run: pnpm --filter @repo/db test

      - name: Web typecheck
        run: pnpm --filter web typecheck

      - name: Web tests
        run: pnpm --filter web test

      - name: Web authentication smoke
        run: pnpm --filter web auth-smoke

      - name: Web production build
        run: pnpm --filter web build

      - name: Lint
        run: pnpm lint

      # MCP's SDK is a devDependency but is bundled into the shipped CLI.
      # Audit tooling too so package scope cannot hide release dependencies.
      - name: Full dependency audit
        run: pnpm audit --audit-level=low

  # A Linux typecheck cannot prove that Electron packaged the Windows native
  # addons. Build the actual NSIS updater on every PR and retain it for native
  # Windows smoke testing. Same-repo PRs and pushes to main only. Fork PRs still
  # get the Ubuntu typecheck/test job; they must not produce a downloadable
  # installer artifact from untrusted code.
  #
  # Always unsigned: this job runs PR-controlled scripts, so it references no
  # secrets at all. Signing runs only in windows-sign.yml, on main or a release
  # tag, inside the protected windows-signing environment.
  windows-package:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10.33.2

      - name: Install with Windows native dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop typecheck
        run: pnpm --filter desktop typecheck

      - name: Desktop tests
        run: pnpm --filter desktop test

      # Round 24 (Astra): the overlay's cards rendered for real (Electron's Chromium, the bundled font, the window
      # size the app gives them): the buttons and a line of the dictated text stay in view for every notice variant.
      - name: Overlay card layout (rendered)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $fixtures = Join-Path $env:RUNNER_TEMP "overlay-layout.json"
          pnpm --filter desktop exec tsx scripts/overlay-layout-fixtures.ts $fixtures
          if ($LASTEXITCODE -ne 0) { throw "Overlay layout fixtures failed" }
          pnpm --filter desktop exec electron scripts/test-overlay-layout.cjs $fixtures
          if ($LASTEXITCODE -ne 0) { throw "Overlay card layout check failed" }

      # Bark's Windows helper is C# built with the .NET Framework 4.8 compiler that
      # ships with Windows (no SDK). Its logic tests run before packaging.
      - name: Build and test the Windows dictation helper
        timeout-minutes: 10
        run: |
          pnpm --filter desktop helper:win
          engine/.build/windows/dictation-helper-tests.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows dictation helper tests failed" }

      # No credentials reach this job: sign-windows.cjs logs "signing skipped:
      # no credentials" and the build is unsigned.
      - name: Build Windows installer
        run: pnpm --filter desktop package:win

      # app.asar must hold only out/** and runtime node_modules: no src/,
      # scripts/, docs/, tooling, tests or app sourcemaps. Every DLL a packaged
      # .node/.dll/.exe imports (PE import and delay-load tables) must be in the
      # package beside it or beside the exe unless it is a Windows/VC++/driver DLL,
      # ggml's run-time CPU and Vulkan backends must be there, and the check must
      # report a ggml-base.dll treated as absent (negative control). The QA package
      # check below runs the same closure.
      - name: Check Windows app.asar contents
        timeout-minutes: 5
        run: node apps/desktop/scripts/test-windows-package.cjs apps/desktop/release/win-unpacked

      # The install folder migration's path and process guards, compiled with
      # electron-builder's makensis and run against real junctions, a held file and
      # real processes in a temporary sandbox.
      - name: Check Windows installer migration guards
        timeout-minutes: 10
        run: node apps/desktop/scripts/test-windows-installer-guards.cjs

      - name: Test recorder with packaged Electron runtime
        run: node apps/desktop/scripts/test-electron-runtime.cjs apps/desktop/release/win-unpacked/DoodleNote.exe

      - name: Verify one Windows app instance per profile
        shell: pwsh
        run: |
          $qaDirectory = Join-Path $env:RUNNER_TEMP "doodle-electron-qa"
          npm install --prefix $qaDirectory --no-audit --no-fund --ignore-scripts playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw "Playwright setup failed" }
          $env:DOODLE_PLAYWRIGHT_MODULE = Join-Path $qaDirectory "node_modules/playwright"
          node apps/desktop/scripts/test-single-instance.cjs apps/desktop/release/win-unpacked/DoodleNote.exe
          if ($LASTEXITCODE -ne 0) { throw "Single-instance Windows smoke failed" }
          node apps/desktop/scripts/test-windows-asr-runtime.cjs apps/desktop/release/win-unpacked/DoodleNote.exe
          if ($LASTEXITCODE -ne 0) { throw "Packaged Windows ASR initialization failed" }

      - name: Check Windows window chrome behavior
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:DOODLE_PLAYWRIGHT_MODULE = Join-Path $env:RUNNER_TEMP "doodle-electron-qa/node_modules/playwright"
          node apps/desktop/scripts/test-windows-chrome.cjs apps/desktop/release/win-unpacked/DoodleNote.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows window chrome behavior check failed" }

      - name: Smoke packaged Windows dictation helper
        timeout-minutes: 5
        shell: pwsh
        run: |
          $helper = "apps/desktop/release/win-unpacked/resources/engine/dictation-helper.exe"
          if (-not (Test-Path $helper)) { throw "The dictation helper is missing from the package" }
          # --signing-fixture: signs a COPY with a temporary user-scoped self-signed certificate
          # (removed afterwards, never executed) to prove the manifest digest is signing-invariant.
          node apps/desktop/scripts/test-dictation-helper-win.cjs $helper --signing-fixture
          if ($LASTEXITCODE -ne 0) { throw "Packaged dictation helper smoke failed" }

      # Kept clipboard records round-trip through the SHIPPED helper's clipboard-offers / -restore / -dismiss.
      # The records are made by the test-ops build (same sources) ended at a journaled stage; no window, no input.
      - name: Clipboard offers end to end on the packaged helper
        timeout-minutes: 20
        shell: pwsh
        run: |
          $helper = "apps/desktop/release/win-unpacked/resources/engine/dictation-helper.exe"
          $testops = "engine/.build/windows/dictation-helper-testops.exe"
          if (-not (Test-Path $testops)) { throw "The test-ops helper build is missing" }
          node apps/desktop/scripts/test-dictation-helper-offers-win.cjs $helper $testops
          if ($LASTEXITCODE -ne 0) { throw "Clipboard offers end-to-end check failed" }

      - name: Smoke packaged Windows native modules
        shell: pwsh
        run: |
          $appDir = (Resolve-Path "apps/desktop/release/win-unpacked").Path
          $script = Join-Path $env:RUNNER_TEMP "doodlenote-native-smoke.cjs"
          @'
          const fs = require('node:fs')
          const path = require('node:path')
          const root = process.argv[2]
          const unpacked = path.join(root, 'resources', 'app.asar.unpacked', 'node_modules')
          const sherpa = require(path.join(unpacked, 'sherpa-onnx-node'))
          if (typeof sherpa.OnlineRecognizer !== 'function') {
            throw new Error('sherpa-onnx OnlineRecognizer did not load')
          }
          function find(rootDir, wanted) {
            for (const entry of fs.readdirSync(rootDir, { withFileTypes: true })) {
              const file = path.join(rootDir, entry.name)
              if (entry.isDirectory()) {
                const found = find(file, wanted)
                if (found) return found
              } else if (entry.name === wanted) return file
            }
            return null
          }
          const llama = find(path.join(unpacked, '@node-llama-cpp', 'win-x64'), 'llama-addon.node')
          if (!llama) throw new Error('CPU llama addon is missing')
          require(llama)
          console.log('Packaged sherpa and llama native modules loaded successfully')
          // Match the app's native-addon shutdown workaround: after proving
          // both addons loaded, do not run llama's fragile process teardown.
          process.exit(0)
          '@ | Set-Content -Path $script -Encoding UTF8
          $env:ELECTRON_RUN_AS_NODE = "1"
          $output = & (Join-Path $appDir "DoodleNote.exe") $script $appDir 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch "Packaged sherpa and llama native modules loaded successfully") {
            throw "Packaged native module smoke did not reach the success sentinel"
          }

      - name: Verify Windows artifacts and signature state
        shell: pwsh
        run: |
          $manifest = "apps/desktop/release/latest.yml"
          if (-not (Test-Path $manifest)) { throw "latest.yml was not generated" }
          $installer = Get-ChildItem "apps/desktop/release/DoodleNote-*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not generated" }
          if (-not (Test-Path "$($installer.FullName).blockmap")) { throw "Updater blockmap was not generated" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          Write-Host "Installer: $($installer.Name)"
          Write-Host "Authenticode: $($signature.Status)"
          if ($signature.Status -ne "NotSigned") {
            # Whatever signed it, a signed installer means every shipped PE must be
            # validly signed too (installer, helper, every exe/dll/node).
            & apps/desktop/scripts/verify-windows-signature.ps1
          } else {
            Write-Host "signing skipped: no credentials (unsigned CI build; signature verification not applicable)"
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doodlenote-windows-${{ github.sha }}
          path: |
            apps/desktop/release/DoodleNote-*-setup.exe
            apps/desktop/release/DoodleNote-*-setup.exe.blockmap
            apps/desktop/release/latest.yml
          retention-days: 7

      # The QA identity package (the one the upgrade test installs) must ship
      # exactly the production package's files: the same app.asar entries and the
      # same app.asar.unpacked files, byte for byte (SHA-256 of every asar entry and
      # every unpacked file), apart from the identity files test-windows-package.cjs
      # allows (IDENTITY_DIFFERENCES: package.json "name"; in out/main/index.js the
      # identity block and the Bark helper digest), and every other file of the two
      # win-unpacked folders byte for byte as well, apart from PACKAGE_DIFFERENCES
      # (the exe's product-name strings and ASAR integrity record; the helper's
      # csc.exe time stamp and module version id; its manifest's digests, which
      # must describe its own helper) and app-update.yml (production only).
      # Before comparing, each package is checked on its own (round 9): its exe's
      # product-name strings and ASAR integrity record, its bundle's identity and
      # helper digest, its helper manifest and module version id are its own, so
      # a file copied from the other package (identical, so never "a difference")
      # is still caught.
      # --negative-control then changes one byte in an unpacked file, an asar entry,
      # out/main/index.js, resources\mcp\cli.js, the exe and the helper (incl. one
      # inside each allowance's neighbourhood), copies the production exe and
      # helper manifest into the QA package, and adds a feed file to the QA
      # package, and fails unless each is caught exactly (bytes put back).
      # Built last: it rebuilds out/ with the QA identity. Built as the full
      # installer, not --dir: the NSIS target is what adds resources\elevate.exe,
      # and the QA installer is what the upgrade test installs.
      - name: Check the QA package ships exactly the production package's files
        timeout-minutes: 15
        run: |
          node apps/desktop/scripts/package-win-qa.cjs
          if ($LASTEXITCODE -ne 0) { throw "QA package build failed" }
          node apps/desktop/scripts/test-windows-package.cjs apps/desktop/release-qa/win-unpacked --same-files-as apps/desktop/release/win-unpacked --negative-control
          if ($LASTEXITCODE -ne 0) { throw "The QA package does not ship the production package's files" }

  # A real installer lifecycle of the QA identity on this throwaway runner: the
  # legacy-layout QA package installed /S, the current QA package /S --updated over
  # it, the app's first launch consuming the installer's record, uninstall /S; an
  # upgrade killed right after electron-builder's "uninstall old version" and then
  # recovered; /S without --updated while the legacy app runs (exit 2); a held file
  # keeping the journal armed across two runs. Registry, folders, Run value,
  # shortcuts and MCP configs are checked after each step (each step timed in the
  # job summary). It stands in for the installer items of the desktop pass while
  # Smart App Control blocks fresh unsigned executables on the QA machine
  # (docs/WINDOWS-RELEASE-QA.md "Installer end-to-end in CI"). Never production.
  # The legacy and kill-step installers are built from the same win-unpacked
  # (--prepackaged, stored rather than compressed, to save time); the kill-step
  # one includes build/windows-installer-test-steps.nsh, which no release uses.
  windows-installer-e2e:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10.33.2

      - name: Install with Windows native dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the QA installer
        timeout-minutes: 15
        run: |
          node apps/desktop/scripts/package-win-qa.cjs
          if ($LASTEXITCODE -ne 0) { throw "QA installer build failed" }

      - name: Build the legacy-layout and kill-step QA installers
        timeout-minutes: 8
        working-directory: apps/desktop
        env:
          DOODLENOTE_QA_IDENTITY: '1'
          npm_config_user_agent: pnpm
        # Quoted: pwsh splits a bare -c.key=value native argument at the dot.
        run: |
          $env:DOODLENOTE_QA_LEGACY_LAYOUT = '1'
          node node_modules/electron-builder/cli.js --win nsis --x64 --prepackaged release-qa/win-unpacked --config electron-builder.qa.cjs --publish never '-c.compression=store'
          if ($LASTEXITCODE -ne 0) { throw "legacy-layout installer build failed" }
          Remove-Item Env:DOODLENOTE_QA_LEGACY_LAYOUT
          node node_modules/electron-builder/cli.js --win nsis --x64 --prepackaged release-qa/win-unpacked --config electron-builder.qa.cjs --publish never '-c.compression=store' '-c.nsis.include=build/windows-installer-test-steps.nsh' '-c.directories.output=release-qa-steps'
          if ($LASTEXITCODE -ne 0) { throw "kill-step installer build failed" }
          Get-ChildItem release-qa*/*-setup.exe | ForEach-Object { "$($_.FullName) $($_.Length)" }

      - name: Installer lifecycle end to end (QA identity)
        timeout-minutes: 25
        run: |
          $setup = { param($dir) (Get-ChildItem "apps/desktop/$dir/*-setup.exe" | Select-Object -First 1).FullName }
          node apps/desktop/scripts/test-windows-installer-e2e.cjs --legacy (& $setup release-qa-legacy) --current (& $setup release-qa) --steps (& $setup release-qa-steps) --evidence "$env:RUNNER_TEMP/installer-e2e"
          if ($LASTEXITCODE -ne 0) { throw "The installer end-to-end lifecycle failed" }

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/installer-e2e
          if-no-files-found: ignore
          retention-days: 7
