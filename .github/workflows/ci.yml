name: CI

# Guard rail born from two production incidents: a package.json change
# without a lockfile update passes locally (node_modules already present)
# but kills every Vercel deploy with ERR_PNPM_OUTDATED_LOCKFILE — silently,
# since nothing was watching deploy status. Fail the PR instead.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Public CI-only values. Production uses deployment-managed secrets.
      DOODLENOTE_SELF_HOSTED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10.33.2

      # The incident guard. --ignore-scripts skips native postinstalls
      # (electron, llama.cpp, sherpa) that the checks below don't need —
      # lockfile validation happens at resolution time regardless.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Mac candidate verification boundaries
        run: |
          python3 -m unittest discover -s apps/desktop/scripts -p 'test_verify_existing_mac_candidate.py'
          node --test apps/desktop/scripts/mac-candidate-runtime-smoke.test.cjs
          ruby apps/desktop/scripts/test_mac_verification_workflow.rb
          ruby apps/desktop/scripts/test_mac_release_manifest.rb

      - name: Desktop typecheck
        run: pnpm --filter desktop typecheck

      - name: Desktop tests
        run: pnpm --filter desktop test

      - name: Local source index contracts
        run: |
          pnpm --filter @repo/meetings-store typecheck
          pnpm --filter @repo/meetings-store test

      - name: MCP server tests
        run: pnpm --filter doodle-note-mcp test

      - name: Notes engine tests
        run: pnpm --filter @repo/ai test

      - name: Database configuration tests
        run: pnpm --filter @repo/db test

      - name: Web typecheck
        run: pnpm --filter web typecheck

      - name: Web tests
        run: pnpm --filter web test

      - name: Web authentication smoke
        run: pnpm --filter web auth-smoke

      - name: Web production build
        run: pnpm --filter web build

      - name: Lint
        run: pnpm lint

      # MCP's SDK is a devDependency but is bundled into the shipped CLI.
      # Audit tooling too so package scope cannot hide release dependencies.
      - name: Full dependency audit
        run: pnpm audit --audit-level=low

  # A Linux typecheck cannot prove that Electron packaged the Windows native
  # addons. Build the actual NSIS updater on every PR and retain it for native
  # Windows smoke testing. CSC_LINK/CSC_KEY_PASSWORD sign it automatically
  # once the repository's Authenticode certificate secrets are configured.
  # Same-repo PRs and pushes to main only. Fork PRs still get the Ubuntu
  # typecheck/test job; they must not produce a downloadable installer
  # artifact from untrusted code.
  windows-package:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10.33.2

      - name: Install with Windows native dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop typecheck
        run: pnpm --filter desktop typecheck

      - name: Desktop tests
        run: pnpm --filter desktop test

      # Bark's Windows helper is C# built with the .NET Framework 4.8 compiler that
      # ships with Windows (no SDK). Its logic tests run before packaging.
      - name: Build and test the Windows dictation helper
        timeout-minutes: 10
        run: |
          pnpm --filter desktop helper:win
          engine/.build/windows/dictation-helper-tests.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows dictation helper tests failed" }

      - name: Build Windows installer
        run: pnpm --filter desktop package:win

      - name: Test recorder with packaged Electron runtime
        run: node apps/desktop/scripts/test-electron-runtime.cjs apps/desktop/release/win-unpacked/DoodleNote.exe

      - name: Verify one Windows app instance per profile
        shell: pwsh
        run: |
          $qaDirectory = Join-Path $env:RUNNER_TEMP "doodle-electron-qa"
          npm install --prefix $qaDirectory --no-audit --no-fund --ignore-scripts playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw "Playwright setup failed" }
          $env:DOODLE_PLAYWRIGHT_MODULE = Join-Path $qaDirectory "node_modules/playwright"
          node apps/desktop/scripts/test-single-instance.cjs apps/desktop/release/win-unpacked/DoodleNote.exe
          if ($LASTEXITCODE -ne 0) { throw "Single-instance Windows smoke failed" }
          node apps/desktop/scripts/test-windows-asr-runtime.cjs apps/desktop/release/win-unpacked/DoodleNote.exe
          if ($LASTEXITCODE -ne 0) { throw "Packaged Windows ASR initialization failed" }

      - name: Check Windows window chrome behavior
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:DOODLE_PLAYWRIGHT_MODULE = Join-Path $env:RUNNER_TEMP "doodle-electron-qa/node_modules/playwright"
          node apps/desktop/scripts/test-windows-chrome.cjs apps/desktop/release/win-unpacked/DoodleNote.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows window chrome behavior check failed" }

      - name: Smoke packaged Windows dictation helper
        timeout-minutes: 5
        shell: pwsh
        run: |
          $helper = "apps/desktop/release/win-unpacked/resources/engine/dictation-helper.exe"
          if (-not (Test-Path $helper)) { throw "The dictation helper is missing from the package" }
          # --signing-fixture: signs a COPY with a temporary user-scoped self-signed certificate
          # (removed afterwards, never executed) to prove the manifest digest is signing-invariant.
          node apps/desktop/scripts/test-dictation-helper-win.cjs $helper --signing-fixture
          if ($LASTEXITCODE -ne 0) { throw "Packaged dictation helper smoke failed" }

      # Kept clipboard records round-trip through the SHIPPED helper's clipboard-offers / -restore / -dismiss.
      # The records are made by the test-ops build (same sources) ended at a journaled stage; no window, no input.
      - name: Clipboard offers end to end on the packaged helper
        timeout-minutes: 8
        shell: pwsh
        run: |
          $helper = "apps/desktop/release/win-unpacked/resources/engine/dictation-helper.exe"
          $testops = "engine/.build/windows/dictation-helper-testops.exe"
          if (-not (Test-Path $testops)) { throw "The test-ops helper build is missing" }
          node apps/desktop/scripts/test-dictation-helper-offers-win.cjs $helper $testops
          if ($LASTEXITCODE -ne 0) { throw "Clipboard offers end-to-end check failed" }

      - name: Smoke packaged Windows native modules
        shell: pwsh
        run: |
          $appDir = (Resolve-Path "apps/desktop/release/win-unpacked").Path
          $script = Join-Path $env:RUNNER_TEMP "doodlenote-native-smoke.cjs"
          @'
          const fs = require('node:fs')
          const path = require('node:path')
          const root = process.argv[2]
          const unpacked = path.join(root, 'resources', 'app.asar.unpacked', 'node_modules')
          const sherpa = require(path.join(unpacked, 'sherpa-onnx-node'))
          if (typeof sherpa.OnlineRecognizer !== 'function') {
            throw new Error('sherpa-onnx OnlineRecognizer did not load')
          }
          function find(rootDir, wanted) {
            for (const entry of fs.readdirSync(rootDir, { withFileTypes: true })) {
              const file = path.join(rootDir, entry.name)
              if (entry.isDirectory()) {
                const found = find(file, wanted)
                if (found) return found
              } else if (entry.name === wanted) return file
            }
            return null
          }
          const llama = find(path.join(unpacked, '@node-llama-cpp', 'win-x64'), 'llama-addon.node')
          if (!llama) throw new Error('CPU llama addon is missing')
          require(llama)
          console.log('Packaged sherpa and llama native modules loaded successfully')
          // Match the app's native-addon shutdown workaround: after proving
          // both addons loaded, do not run llama's fragile process teardown.
          process.exit(0)
          '@ | Set-Content -Path $script -Encoding UTF8
          $env:ELECTRON_RUN_AS_NODE = "1"
          $output = & (Join-Path $appDir "DoodleNote.exe") $script $appDir 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch "Packaged sherpa and llama native modules loaded successfully") {
            throw "Packaged native module smoke did not reach the success sentinel"
          }

      - name: Verify Windows artifacts and signature state
        shell: pwsh
        run: |
          $manifest = "apps/desktop/release/latest.yml"
          if (-not (Test-Path $manifest)) { throw "latest.yml was not generated" }
          $installer = Get-ChildItem "apps/desktop/release/DoodleNote-*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not generated" }
          if (-not (Test-Path "$($installer.FullName).blockmap")) { throw "Updater blockmap was not generated" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($env:CSC_LINK -and $signature.Status -ne "Valid") {
            throw "Signing credentials were supplied but the installer signature is $($signature.Status)"
          }
          Write-Host "Installer: $($installer.Name)"
          Write-Host "Authenticode: $($signature.Status)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doodlenote-windows-${{ github.sha }}
          path: |
            apps/desktop/release/DoodleNote-*-setup.exe
            apps/desktop/release/DoodleNote-*-setup.exe.blockmap
            apps/desktop/release/latest.yml
          retention-days: 7
