name: Mac release candidate

# Builds and verifies a signed/notarized candidate. Does not publish the feed.
# Required repo secrets:
#   DOODLENOTE_GOOGLE_CLIENT_SECRET (Desktop client, not Web)
#   MAC_CSC_LINK (base64 .p12) + MAC_CSC_KEY_PASSWORD
#   APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
# Secure setup: python3 apps/desktop/scripts/configure-mac-release-secrets.py
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build, verify an existing artifact, or probe hosted GUI session prerequisites
        type: choice
        options: [candidate, verify-existing, gui-session-preflight]
        default: candidate
      candidate_run_id:
        description: Exact successful signing run ID (verify-existing only)
        type: string
      candidate_artifact_id:
        description: Exact immutable artifact ID (verify-existing only)
        type: string
      candidate_sha:
        description: Exact 40-character candidate source SHA (verify-existing only)
        type: string
      candidate_version:
        description: Version inside the signed candidate (verify-existing only)
        type: string
      expected_archive_sha256:
        description: Trusted artifact archive SHA256 from GitHub metadata (verify-existing only)
        type: string

permissions:
  contents: read

concurrency:
  group: mac-release-${{ inputs.operation || 'candidate' }}${{ inputs.operation == 'verify-existing' && format('-{0}', inputs.candidate_artifact_id) || '' }}
  cancel-in-progress: false

jobs:
  # Reuse the registered dispatch entry; a new workflow is unavailable until on main.
  # Session diagnostics only: exit blocked, never download or launch the application.
  gui-session-preflight:
    if: github.repository == 'Onyx-Dev-Labs/doodle-note' && inputs.operation == 'gui-session-preflight' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: macos-15 # Explicit supported ARM64 image; verify actual OS/build/arch.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test session-only preflight boundaries (mocked probes)
        run: |
          python3 -m unittest discover -s apps/desktop/scripts -p 'test_hosted_mac_gui_session_preflight.py'
          ruby apps/desktop/scripts/test_hosted_mac_gui_session_workflow.rb
          ruby apps/desktop/scripts/test_mac_verification_workflow.rb

      - name: Record hosted session prerequisites (GUI and updater remain blocked)
        timeout-minutes: 2
        env:
          HARNESS_SHA: ${{ github.sha }}
        run: python3 apps/desktop/scripts/hosted-mac-gui-session-preflight.py --output "$RUNNER_TEMP/hosted-mac-gui-session/result.json"

      - name: Retain session-only report even when blocked
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-mac-gui-session-${{ github.run_id }}
          path: ${{ runner.temp }}/hosted-mac-gui-session/result.json
          retention-days: 14
          if-no-files-found: warn

  release:
    if: github.repository == 'Onyx-Dev-Labs/doodle-note' && (inputs.operation == 'candidate' || inputs.operation == '')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test release tooling
        run: |
          python3 -m unittest discover -s apps/desktop/scripts -p 'test_mac_release_secrets.py'
          ruby apps/desktop/scripts/test_mac_release_manifest.rb
          ruby apps/desktop/scripts/test_mac_verification_workflow.rb

      - name: Check required release credentials
        env:
          DOODLENOTE_GOOGLE_CLIENT_SECRET: ${{ secrets.DOODLENOTE_GOOGLE_CLIENT_SECRET }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 apps/desktop/scripts/configure-mac-release-secrets.py --check-env
          test "$(uname -m)" = arm64

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10.33.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Swift transcription engine
        run: swift build -c release --package-path engine

      - name: Build pinned Whisper batch engine
        run: pnpm whisper:build

      - name: Build brand assets
        run: pnpm --filter desktop brand:build

      - name: Package Mac app (signed + notarized)
        run: |
          node apps/desktop/scripts/check-google-oauth.mjs
          pnpm --filter doodle-note-mcp build
          pnpm --filter desktop exec electron-vite build
          pnpm --filter desktop exec electron-builder --mac --arm64 --publish never -c.forceCodeSigning=true -c.dmg.sign=true
        env:
          DOODLENOTE_GOOGLE_CLIENT_SECRET: ${{ secrets.DOODLENOTE_GOOGLE_CLIENT_SECRET }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Notarize and staple the signed DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          dmg="apps/desktop/release/DoodleNote-${version}-arm64.dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --timeout 20m
          xcrun stapler staple "$dmg"
          ruby apps/desktop/scripts/mac-release-manifest.rb apps/desktop/release "$version" --refresh-dmg

      - name: Verify signed and notarized distributables
        env:
          EXPECTED_TEAM_ID: VTZW6K32K4
        run: bash apps/desktop/scripts/verify-mac-release.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doodlenote-mac-${{ github.sha }}
          path: |
            apps/desktop/release/DoodleNote-*.zip
            apps/desktop/release/DoodleNote-*.dmg
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/release-receipt.txt
          retention-days: 14
          if-no-files-found: error

  verify-existing:
    if: github.repository == 'Onyx-Dev-Labs/doodle-note' && inputs.operation == 'verify-existing' && github.ref != 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test verification boundaries (no candidate execution)
        run: |
          python3 -m unittest discover -s apps/desktop/scripts -p 'test_verify_existing_mac_candidate.py'
          node --test apps/desktop/scripts/mac-candidate-runtime-smoke.test.cjs
          ruby apps/desktop/scripts/test_mac_release_manifest.rb
          ruby apps/desktop/scripts/test_mac_verification_workflow.rb

      - name: Verify exact signed candidate on macOS 14
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          ARCHIVE_SHA256: ${{ inputs.expected_archive_sha256 }}
          HARNESS_SHA: ${{ github.sha }}
        run: |
          python3 apps/desktop/scripts/verify-existing-mac-candidate.py \
            --run-id "$CANDIDATE_RUN_ID" --artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --candidate-sha "$CANDIDATE_SHA" --version "$CANDIDATE_VERSION" \
            --archive-sha256 "$ARCHIVE_SHA256" --harness-sha "$HARNESS_SHA" \
            --output "$RUNNER_TEMP/mac-candidate-verification"

      - name: Retain bounded verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac14-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mac-candidate-verification/result.json
            ${{ runner.temp }}/mac-candidate-verification/commands.log
          retention-days: 14
          if-no-files-found: warn
