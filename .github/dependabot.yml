version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    groups:
      production-security-and-patches:
        dependency-type: production
        update-types:
          - patch
          - minor
      development-tooling:
        dependency-type: development
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Chicago

  - package-ecosystem: swift
    directory: /engine
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Chicago
