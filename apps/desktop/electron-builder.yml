appId: com.doodlenote.desktop
productName: DoodleNote
directories:
  buildResources: resources
  output: release
files:
  - out/**
# The doodle-note-mcp server ships inside the app (all platforms) so MCP
# clients launch it via the DoodleNote binary with ELECTRON_RUN_AS_NODE —
# no Node install or repo checkout needed. Built by the package scripts
# before electron-builder runs.
extraResources:
  - from: ../../packages/doodle-note-mcp/dist/cli.js
    to: mcp/cli.js
  - from: ../../packages/doodle-note-mcp/package.json
    to: mcp/package.json
# Native addons load their binaries from real files on disk.
asarUnpack:
  - "**/node_modules/node-llama-cpp/**"
  - "**/node_modules/@node-llama-cpp/**"
  - "**/node_modules/sherpa-onnx-node/**"
  - "**/node_modules/sherpa-onnx-win-x64/**"
mac:
  # The Swift transcription engine ships beside the app code, outside the
  # asar, so it stays a directly-executable binary. macOS-only — Windows
  # transcription runs in-process via sherpa-onnx.
  extraResources:
    - from: ../../engine/.build/release/engine
      to: engine/engine
    # Keep the opaque artwork under a new bundle resource name. macOS can
    # retain an app icon across in-place auto-updates when CFBundleIconFile
    # keeps pointing at icon.icns, even though the file contents changed.
    - from: resources/icon.icns
      to: doodlenote-opaque-v0411.icns
  # pnpm supportedArchitectures installs every platform's native binaries so
  # cross-builds work; each platform ships only its own.
  files:
    - "!**/node_modules/@node-llama-cpp/win-*/**"
    - "!**/node_modules/@node-llama-cpp/linux-*/**"
    - "!**/node_modules/@node-llama-cpp/mac-x64/**"
    - "!**/node_modules/sherpa-onnx-*/**"
  target:
    - target: dir
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
    # Website visitors receive the familiar drag-to-Applications installer.
    # The ZIP remains required by electron-updater for in-app updates.
    - target: dmg
      arch:
        - arm64
  icon: resources/icon.icns
  category: public.app-category.productivity
  # Signed with Sean's Developer ID (in the login Keychain). Stable signature
  # = safeStorage/Keychain secrets survive rebuilds; TCC grants stick.
  identity: "SEAN INMAN (VTZW6K32K4)"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization runs automatically when APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD
  # / APPLE_TEAM_ID env vars are present; otherwise electron-builder skips it
  # (fine for local installs — notarize before distributing to others).
  notarize: true
  extendInfo:
    CFBundleIconFile: doodlenote-opaque-v0411.icns
    NSMicrophoneUsageDescription: DoodleNote captures meeting audio to transcribe it on-device. Nothing leaves your Mac.
    NSAudioCaptureUsageDescription: DoodleNote captures meeting audio (the other side of your call) to transcribe it on-device.
dmg:
  title: DoodleNote ${version}
  artifactName: ${productName}-${version}-${arch}.${ext}
  backgroundColor: "#f7f5ee"
  iconSize: 104
  window:
    width: 540
    height: 360
  contents:
    - x: 130
      y: 180
      type: file
    - x: 410
      y: 180
      type: link
      path: /Applications
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  # Ship CPU + Vulkan llama binaries (Vulkan covers most Windows GPUs for
  # local note generation); CUDA variants add >500MB for little test value.
  files:
    - "!**/node_modules/@node-llama-cpp/mac-*/**"
    - "!**/node_modules/@node-llama-cpp/linux-*/**"
    - "!**/node_modules/@node-llama-cpp/win-arm64/**"
    - "!**/node_modules/@node-llama-cpp/win-x64-cuda/**"
    - "!**/node_modules/@node-llama-cpp/win-x64-cuda-ext/**"
    - "!**/node_modules/sherpa-onnx-darwin-*/**"
    - "!**/node_modules/sherpa-onnx-linux-*/**"
  # Unsigned for now (no Authenticode cert) — SmartScreen will warn on
  # install; testers click "More info → Run anyway".
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-setup.${ext}
npmRebuild: false
# Auto-update feed: electron-updater reads latest-mac.yml from here.
# scripts/publish-release.mjs uploads the artifacts after packaging.
# Feed served via the app's own domain: static manifests + a Blob proxy
# for artifacts. The raw blob domain got hit by Vercel's bot challenge
# (403 Security Checkpoint) which electron-updater cannot pass.
publish:
  provider: generic
  url: https://www.doodlenote.ai/updates
