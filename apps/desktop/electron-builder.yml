appId: com.doodlenote.desktop
productName: DoodleNote
copyright: Copyright © 2026 Onyx Dev Labs
directories:
  buildResources: resources
  output: release
files:
  - out/**
# The doodle-note-mcp server ships inside the app (all platforms) so MCP
# clients launch it via the DoodleNote binary with ELECTRON_RUN_AS_NODE —
# no Node install or repo checkout needed. Built by the package scripts
# before electron-builder runs.
extraResources:
  - from: src/renderer/src/assets/fonts
    to: licenses/fonts
    filter: ["*-OFL.txt"]
  - from: ../../packages/doodle-note-mcp/dist/cli.js
    to: mcp/cli.js
  - from: ../../packages/doodle-note-mcp/package.json
    to: mcp/package.json
# Native addons load their binaries from real files on disk.
asarUnpack:
  - "**/node_modules/node-llama-cpp/**"
  - "**/node_modules/@node-llama-cpp/**"
  - "**/node_modules/sherpa-onnx-node/**"
  - "**/node_modules/sherpa-onnx-win-x64/**"
  - "**/node_modules/koffi/**"
  - "**/node_modules/@koromix/koffi-win32-x64/**"
mac:
  # The Swift transcription engine ships beside the app code, outside the
  # asar, so it stays a directly-executable binary. macOS-only — Windows
  # transcription runs in-process via sherpa-onnx.
  extraResources:
    - from: resources/tray
      to: tray
      filter: ["*.png"]
    - from: ../../engine/.build/release/engine
      to: engine/engine
    # Bark's typing helper: a separate small binary, signed like the engine.
    - from: ../../engine/.build/release/dictation-helper
      to: engine/dictation-helper
    - from: ../../engine/.build/whisper/whisper-cli
      to: engine/whisper-cli
    - from: ../../engine/.build/whisper/whisper-LICENSE.txt
      to: engine/whisper-LICENSE.txt
    - from: resources/whisper-model-LICENSE.txt
      to: engine/whisper-model-LICENSE.txt
    # Keep the opaque artwork under a new bundle resource name. macOS can
    # retain an app icon across in-place auto-updates when CFBundleIconFile
    # keeps pointing at icon.icns, even though the file contents changed.
    - from: resources/icon.icns
      to: doodlenote-opaque-v0411.icns
  # pnpm supportedArchitectures installs every platform's native binaries so
  # cross-builds work; each platform ships only its own.
  files:
    # Platform files replace the shared allowlist. Keep it explicit so local
    # installers, source, and QA artifacts cannot be bundled into the app.
    - out/**
    - "!**/node_modules/@node-llama-cpp/win-*/**"
    - "!**/node_modules/@node-llama-cpp/linux-*/**"
    - "!**/node_modules/@node-llama-cpp/mac-x64/**"
    - "!**/node_modules/sherpa-onnx-*/**"
    # Koffi only pins the Windows speech runtime; macOS never loads it.
    - "!**/node_modules/koffi/**"
    - "!**/node_modules/@koromix/**"
  target:
    - target: dir
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
    # Website visitors receive the familiar drag-to-Applications installer.
    # The ZIP remains required by electron-updater for in-app updates.
    - target: dmg
      arch:
        - arm64
  icon: resources/icon.icns
  category: public.app-category.productivity
  # Keep the shipped Developer ID team: Squirrel.Mac requires the same team
  # for automatic updates. CI holds its certificate and notarization credentials.
  identity: "SEAN INMAN (VTZW6K32K4)"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization runs automatically when APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD
  # / APPLE_TEAM_ID env vars are present; otherwise electron-builder skips it
  # (fine for local installs — notarize before distributing to others).
  notarize: true
  extendInfo:
    CFBundleIconFile: doodlenote-opaque-v0411.icns
    NSMicrophoneUsageDescription: DoodleNote captures meeting audio, and your voice when you use Bark dictation, to transcribe it on-device. Nothing leaves your Mac.
    NSAudioCaptureUsageDescription: DoodleNote captures meeting audio (the other side of your call) to transcribe it on-device.
dmg:
  title: DoodleNote ${version}
  artifactName: ${productName}-${version}-${arch}.${ext}
  backgroundColor: "#f7f5ee"
  iconSize: 104
  window:
    width: 540
    height: 360
  contents:
    - x: 130
      y: 180
      type: file
    - x: 410
      y: 180
      type: link
      path: /Applications
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  # Notification-area dogs (multi-size ICO), loaded from Resources/tray.
  extraResources:
    - from: resources/tray
      to: tray
      filter: ["*.ico"]
    # Bark's Windows helper (hold-to-talk key, typing into the focused app), built
    # by scripts/build-dictation-helper-win.cjs with the .NET Framework 4.8 compiler.
    - from: ../../engine/.build/windows/dictation-helper.exe
      to: engine/dictation-helper.exe
    - from: ../../engine/.build/windows/dictation-helper.manifest.json
      to: engine/dictation-helper.manifest.json
  # Ship CPU + Vulkan llama binaries (Vulkan covers most Windows GPUs for
  # local note generation); CUDA variants add >500MB for little test value.
  files:
    # Platform files replace the shared allowlist (as on mac): without out/**
    # here the exclusions alone shipped src/, scripts/, docs/ and tooling.
    # scripts/test-windows-package.cjs fails CI if they return.
    - out/**
    - "!**/node_modules/@node-llama-cpp/mac-*/**"
    - "!**/node_modules/@node-llama-cpp/linux-*/**"
    - "!**/node_modules/@node-llama-cpp/win-arm64/**"
    - "!**/node_modules/@node-llama-cpp/win-x64-cuda/**"
    - "!**/node_modules/@node-llama-cpp/win-x64-cuda-ext/**"
    - "!**/node_modules/sherpa-onnx-darwin-*/**"
    - "!**/node_modules/sherpa-onnx-linux-*/**"
    # Only the x64 Windows builds of other native modules can load (or be
    # Authenticode-signed); macOS/Linux/ARM copies were shipping unpacked.
    - "!**/node_modules/@koromix/koffi-{darwin,linux,freebsd,openbsd,android}-*/**"
    - "!**/node_modules/@koromix/koffi-win32-{arm64,ia32}/**"
    - "!**/node_modules/@reflink/reflink-{darwin,linux}-*/**"
    - "!**/node_modules/@reflink/reflink-win32-arm64-msvc/**"
  # Signing: scripts/sign-windows.cjs signs every exe/dll/node electron-builder
  # offers (app exe, Electron DLLs, unpacked native modules, installer and
  # uninstaller) with Microsoft Artifact Signing when its CI secrets exist, and
  # logs "signing skipped: no credentials" otherwise (unsigned, as before).
  # package:win signs the Bark helper itself; electron-builder never offers it.
  # Unsigned builds make SmartScreen warn on install.
  signExts: [".dll", ".node"]
  signtoolOptions:
    sign: ./scripts/sign-windows.cjs
    # Artifact Signing signs SHA-256 only; one call per file.
    signingHashAlgorithms: [sha256]
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  # Moves installs from the package-named Programs\desktop folder to
  # Programs\DoodleNote. appId (and so the uninstall key) and the app profile
  # (%APPDATA%\desktop) are deliberately unchanged.
  include: build/windows-installer.nsh
  artifactName: ${productName}-${version}-setup.${ext}
npmRebuild: false
# Auto-update feed: electron-updater reads latest-mac.yml from here.
# scripts/publish-release.mjs uploads the artifacts after packaging.
# Feed served via the app's own domain: static manifests + a Blob proxy
# for artifacts. The raw blob domain got hit by Vercel's bot challenge
# (403 Security Checkpoint) which electron-updater cannot pass.
publish:
  provider: generic
  url: https://www.doodlenote.ai/updates
  # Vercel Blob supports one byte range per request, not multipart ranges.
  useMultipleRangeRequest: false
