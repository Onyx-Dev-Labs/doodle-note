# DoodleNote iOS — xcodegen project spec.
# Regenerate the .xcodeproj with: xcodegen generate (run from this directory)
name: DoodleNote
options:
  bundleIdPrefix: com.doodlenote
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.4
  TwilioVoice:
    url: https://github.com/twilio/twilio-voice-ios
    from: 6.10.0
schemes:
  DoodleNote:
    build:
      targets:
        DoodleNote: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DoodleNoteTests
        - DoodleNoteUITests
targets:
  DoodleNoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DoodleNoteTests
    dependencies:
      - target: DoodleNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doodlenote.ios.tests
        DEVELOPMENT_TEAM: VTZW6K32K4
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "6.0"
  DoodleNoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DoodleNoteUITests
    dependencies:
      - target: DoodleNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doodlenote.ios.uitests
        DEVELOPMENT_TEAM: VTZW6K32K4
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "6.0"
  DoodleNote:
    type: application
    platform: iOS
    sources:
      - DoodleNote
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: TwilioVoice
        product: TwilioVoice
    info:
      path: DoodleNote/Info.plist
      properties:
        CFBundleDisplayName: DoodleNote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: DoodleNote records your meetings so it can transcribe them on this device. Audio never leaves your phone.
        NSSpeechRecognitionUsageDescription: DoodleNote transcribes your meetings entirely on this device.
        NSCalendarsFullAccessUsageDescription: DoodleNote shows your upcoming meetings so you can start notes with one tap. Calendar data stays on your phone.
        UIBackgroundModes: [audio]
        # Account-link callback: Safari hands the sync token back via
        # doodlenote://link?token=...
        CFBundleURLTypes:
          - CFBundleURLName: com.doodlenote.ios
            CFBundleURLSchemes: [doodlenote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doodlenote.ios
        PRODUCT_NAME: DoodleNote
        MARKETING_VERSION: 0.4.8
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: VTZW6K32K4
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_EMIT_LOC_STRINGS: false
